# Himalaya lock screen — intentionally minimal.
# The wallpaper path points to the single repository asset.

general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = false
}

background {
    monitor =
    path = ~/.config/hypr/assets/himalaya.png
    blur_passes = 2
    blur_size = 8
    color = rgba(8, 16, 22, 1.0)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(230, 240, 240, 0.96)
    font_size = 86
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A  •  %d %B')"
    color = rgba(116, 215, 200, 0.95)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 58
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 72
    outline_thickness = 2
    inner_color = rgba(16, 26, 34, 0.68)
    outer_color = rgba(116, 215, 200, 0.8)
    font_color = rgba(230, 240, 240, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Unlock Himalaya</i>
    hide_input = false
    rounding = 14
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>SUPER + Q</i>  close   •   <i>SUPER + SPACE</i>  launch
    color = rgba(140, 165, 171, 0.85)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -160
    halign = center
    valign = center
}
